{% extends "base.html" %}
{% block content %}
<div class="section-header">
    <div>
        <h1>Account Settings</h1>
        <p class="section-subtitle">Update your profile details or change your password.</p>
    </div>
    <a href="{{ url_for('auth.dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
</div>

<div class="dashboard-layout">
    <section class="card">
        <h2>Profile Details</h2>
        <form method="POST" action="{{ url_for('auth.account') }}" class="form-stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="action" value="profile">
            <div class="form-group">
                <label for="name">Full name</label>
                <input id="name" name="name" type="text" maxlength="100" value="{{ request.form.get('name', g.user['name']) }}" autocomplete="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" value="{{ request.form.get('email', g.user['email']) }}" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone number</label>
                <input id="phone" name="phone" type="tel" value="{{ request.form.get('phone', g.user['phone']) }}" autocomplete="tel">
            </div>
            <button type="submit" class="btn btn-primary">Save Profile</button>
        </form>
    </section>

    <section class="card">
        <h2>Change Password</h2>
        <form method="POST" action="{{ url_for('auth.account') }}" class="form-stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="action" value="password">
            <div class="form-group">
                <label for="current_password">Current password</label>
                <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
            </div>
            <div class="form-group">
                <label for="new_password">New password (at least 10 characters)</label>
                <input id="new_password" name="new_password" type="password" minlength="10" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm new password</label>
                <input id="confirm_password" name="confirm_password" type="password" minlength="10" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary">Change Password</button>
        </form>
    </section>
</div>
{% endblock %}
