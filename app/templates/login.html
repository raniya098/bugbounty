{% extends "base.html" %}
{% block content %}
<div class="card auth-card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
        <span class="badge">Welcome Back</span>
        <h2>Sign In to EventHub</h2>
        <p class="meta">Access your bookings and tickets.</p>
    </div>

    <form method="POST"
          action="{{ url_for('auth.login') }}"
          class="form-stack"
          id="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="name@example.com"
                   value="{{ request.form.get('email', '') }}"
                   required
                   autocomplete="email">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div style="position: relative; display: flex; align-items: center;">
                <input type="password"
                       id="password"
                       name="password"
                       required
                       autocomplete="current-password"
                       style="width: 100%; padding-right: 4rem;">
                <button type="button"
                        id="toggle-password"
                        aria-label="Show password"
                        aria-controls="password"
                        aria-pressed="false"
                        style="position: absolute; right: 0.75rem; background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.8rem; font-weight: 600;">
                    Show
                </button>
            </div>
        </div>

        <button type="submit"
                class="btn btn-primary btn-block"
                id="login-submit-btn">
            Sign In
        </button>
    </form>

    <hr class="divider">
    <p class="meta" style="text-align: center;">
        New to EventHub?
        <a href="{{ url_for('auth.register') }}">Create an account</a>
    </p>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const passwordInput = document.getElementById("password");
    const toggleButton = document.getElementById("toggle-password");

    if (passwordInput && toggleButton) {
        toggleButton.addEventListener("click", () => {
            const showingPassword = passwordInput.type === "password";

            passwordInput.type = showingPassword ? "text" : "password";
            toggleButton.textContent = showingPassword ? "Hide" : "Show";
            toggleButton.setAttribute(
                "aria-label",
                showingPassword ? "Hide password" : "Show password"
            );
            toggleButton.setAttribute("aria-pressed", String(showingPassword));
        });
    }

    const form = document.getElementById("login-form");
    const submitButton = document.getElementById("login-submit-btn");

    if (form && submitButton) {
        form.addEventListener("submit", () => {
            submitButton.disabled = true;
            submitButton.textContent = "Signing In...";
        });
    }
});
</script>
{% endblock %}
